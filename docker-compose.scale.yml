# ==============================================================================
#  OVERRIDE — two app replicas, for the cross-pod admission check (Task 13)
# ==============================================================================
#  Cross-pod admission is the one guarantee a single process cannot demonstrate:
#  a `static Semaphore(4)` satisfies every single-JVM test while failing in the
#  deployment this service actually targets (3 pods on OpenShift). Two replicas
#  against one database is the smallest honest reproduction.
#
#    docker compose -f docker-compose.yml -f docker-compose.scale.yml \
#                   up -d --scale app=2
#
#  `ports` is emptied because two replicas cannot both publish host 8080. The
#  replicas are reached over the compose network by service name, which is all
#  the admission check needs.
# ==============================================================================
services:
  app:
    ports: !reset []
