# EXAMPLE ONLY — keys, no values. Copy to secret.yaml (gitignored), fill in
# through the cluster's own secrets tooling (not by hand in a file that ever
# reaches git), and apply. deployment.yaml consumes every key here in bulk
# via envFrom.secretRef; none of these names are hardcoded individually in
# the Deployment.
apiVersion: v1
kind: Secret
metadata:
  name: omniflux-exchange-secrets
  labels:
    app: omniflux-exchange
type: Opaque
stringData:
  SPRING_R2DBC_USERNAME: ""
  SPRING_R2DBC_PASSWORD: ""
  SPRING_FLYWAY_USER: ""
  SPRING_FLYWAY_PASSWORD: ""
  OMNIFLUX_STORAGE_ACCESS_KEY: ""
  OMNIFLUX_STORAGE_SECRET_KEY: ""
  DATA_API_TOKEN_URL: ""
  DATA_API_CLIENT_ID: ""
  DATA_API_CLIENT_SECRET: ""
